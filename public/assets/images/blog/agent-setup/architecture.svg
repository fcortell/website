<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d">
  <title id="t">Architecture of a personal AI agent running on a 2012 MacBook Pro</title>
  <desc id="d">Telegram on a phone talks over HTTPS to the agent running on an old MacBook Pro; the agent calls a remote model API; an admin laptop reaches the same Mac over SSH inside a private network.</desc>
  <rect x="0" y="0" width="960" height="460" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#0f172a">
    <!-- phone -->
    <rect x="40" y="170" width="180" height="120" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="130" y="215" text-anchor="middle" font-size="17" font-weight="600">Telegram</text>
    <text x="130" y="240" text-anchor="middle" font-size="13" fill="#475569">phone, any network</text>
    <text x="130" y="262" text-anchor="middle" font-size="13" fill="#475569">chat is the UI</text>

    <!-- mac -->
    <rect x="330" y="80" width="330" height="300" rx="16" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="495" y="112" text-anchor="middle" font-size="17" font-weight="600">MacBook Pro (2012)</text>
    <text x="495" y="134" text-anchor="middle" font-size="12.5" fill="#64748b">4-core i7 · 8 GB RAM · always on</text>

    <rect x="352" y="152" width="286" height="44" rx="9" fill="#eef2ff" stroke="#6366f1"/>
    <text x="495" y="179" text-anchor="middle" font-size="14" font-weight="600">Hermes Agent runtime</text>

    <rect x="352" y="208" width="136" height="64" rx="9" fill="#ffffff" stroke="#94a3b8"/>
    <text x="420" y="234" text-anchor="middle" font-size="12.5" font-weight="600">Memory</text>
    <text x="420" y="254" text-anchor="middle" font-size="11.5" fill="#64748b">always in context</text>

    <rect x="502" y="208" width="136" height="64" rx="9" fill="#ffffff" stroke="#94a3b8"/>
    <text x="570" y="234" text-anchor="middle" font-size="12.5" font-weight="600">Skills</text>
    <text x="570" y="254" text-anchor="middle" font-size="11.5" fill="#64748b">loaded on demand</text>

    <rect x="352" y="286" width="286" height="70" rx="9" fill="#ffffff" stroke="#94a3b8"/>
    <text x="495" y="312" text-anchor="middle" font-size="12.5" font-weight="600">Tools</text>
    <text x="495" y="333" text-anchor="middle" font-size="11.5" fill="#64748b">shell · files · Mail.app · scheduled jobs</text>

    <!-- model cloud -->
    <rect x="730" y="110" width="190" height="110" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="825" y="146" text-anchor="middle" font-size="15" font-weight="600">Model API</text>
    <text x="825" y="170" text-anchor="middle" font-size="12.5" fill="#475569">OpenCode</text>
    <text x="825" y="190" text-anchor="middle" font-size="12.5" fill="#475569">DeepSeek Flash</text>

    <!-- admin -->
    <rect x="730" y="280" width="190" height="100" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="825" y="314" text-anchor="middle" font-size="15" font-weight="600">SSH over Tailscale</text>
    <text x="825" y="338" text-anchor="middle" font-size="12.5" fill="#475569">admin from anywhere</text>
    <text x="825" y="358" text-anchor="middle" font-size="12.5" fill="#475569">no ports open</text>

    <!-- links -->
    <line x1="220" y1="230" x2="330" y2="230" stroke="#334155" stroke-width="2"/>
    <polygon points="330,230 320,225 320,235" fill="#334155"/>
    <polygon points="220,230 230,225 230,235" fill="#334155"/>
    <text x="275" y="218" text-anchor="middle" font-size="11.5" fill="#475569">HTTPS</text>

    <line x1="660" y1="174" x2="730" y2="166" stroke="#0ea5e9" stroke-width="2"/>
    <polygon points="730,166 720,161 721,171" fill="#0ea5e9"/>
    <text x="694" y="152" text-anchor="middle" font-size="11.5" fill="#0369a1">inference</text>

    <line x1="730" y1="330" x2="660" y2="322" stroke="#334155" stroke-width="2"/>
    <polygon points="660,322 670,317 669,327" fill="#334155"/>
    <text x="694" y="348" text-anchor="middle" font-size="11.5" fill="#475569">private net</text>
  </g>
</svg>
